# LogiCode · ejecución local completa con Docker Compose.
# Uso: copiar .env.example a .env, ajustar valores y ejecutar `docker compose up --build`.
name: logicode

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logicode}
      POSTGRES_USER: ${DB_USERNAME:-logicode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    # Solo accesible desde este equipo (127.0.0.1), para herramientas de desarrollo y
    # para ejecutar el backend fuera de Docker. No se expone a la red ni a React.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-logicode}
      DB_USERNAME: ${DB_USERNAME:-logicode}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      LOGICODE_ENVIRONMENT: docker
      LOGICODE_TIME_ZONE: ${LOGICODE_TIME_ZONE:-America/Bogota}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - file-storage:/var/lib/logicode/files
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  db-data:
  # Reservado para el almacenamiento local de archivos (Etapas 4 y 5). Aún no se usa.
  file-storage:
