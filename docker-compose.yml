# LogiCode · ejecución local completa con Docker Compose.
# Uso: copiar .env.example a .env, ajustar valores y ejecutar `docker compose up --build`.
# Con calificación por IA: LOGICODE_AI_ENABLED=true en .env y `docker compose --profile ia up --build`
# (ver README, sección "Calificación con IA").
name: logicode

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logicode}
      POSTGRES_USER: ${DB_USERNAME:-logicode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [datos]
    # Solo accesible desde este equipo (127.0.0.1), para herramientas de desarrollo y
    # para ejecutar el backend fuera de Docker. No se expone a la red ni a React.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Archivos cargados (P-05): MinIO, almacenamiento de objetos compatible con S3. Solo lo usa el backend; no se
  # publica fuera de Docker. La imagen oficial dejó de publicarse en 2026; esta es el fork comunitario de MinIO (T-85).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-logicode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en el archivo .env (mínimo 8 caracteres)}
    volumes:
      - minio-data:/data
    networks: [datos]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-logicode}
      DB_USERNAME: ${DB_USERNAME:-logicode}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      LOGICODE_ENVIRONMENT: docker
      LOGICODE_TIME_ZONE: ${LOGICODE_TIME_ZONE:-America/Bogota}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Dirección pública de la interfaz, usada en los enlaces de los correos.
      LOGICODE_PUBLIC_URL: ${LOGICODE_PUBLIC_URL:-http://localhost:3000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-2h}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # outbox: los correos se guardan como archivos en ./.local/mail-outbox (desarrollo).
      # Para enviar con Brevo, ver docker-compose.brevo.yml.
      LOGICODE_MAIL_PROVIDER: ${LOGICODE_MAIL_PROVIDER:-outbox}
      LOGICODE_MAIL_OUTBOX_DIR: /var/lib/logicode/mail-outbox
      # Archivos de materiales y entregas en MinIO; se conservan como mínimo 6 meses (RN-21). La carpeta
      # file-storage queda para las cargas en curso; lo que tenía antes de MinIO se sube solo al arrancar.
      LOGICODE_FILES_STORAGE: minio
      LOGICODE_FILES_DIR: /var/lib/logicode/files
      LOGICODE_MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-logicode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en el archivo .env (mínimo 8 caracteres)}
      LOGICODE_FILE_RETENTION_MONTHS: ${LOGICODE_FILE_RETENTION_MONTHS:-6}
      # Carpeta compartida con el servicio backup: el panel lista las copias y deja ahí las solicitudes.
      LOGICODE_BACKUPS_DIR: /var/lib/logicode/backups
      # Calificación con IA (Etapa 6): Ollama + Qwen2.5-VL 7B en el servicio ollama (perfil ia).
      LOGICODE_AI_ENABLED: ${LOGICODE_AI_ENABLED:-false}
      LOGICODE_AI_OLLAMA_URL: http://ollama:11434
      LOGICODE_AI_MODEL: ${LOGICODE_AI_MODEL:-qwen2.5vl:7b}
      LOGICODE_AI_TIMEOUT: ${LOGICODE_AI_TIMEOUT:-10m}
      LOGICODE_AI_MAX_ATTEMPTS: ${LOGICODE_AI_MAX_ATTEMPTS:-3}
      LOGICODE_AI_CALIBRATION_MIN: ${LOGICODE_AI_CALIBRATION_MIN:-10}
      # Cuentas iniciales con privilegio completo (D-03). Sus datos reales solo van en .env.
      INITIAL_ADMIN_1_CEDULA: ${INITIAL_ADMIN_1_CEDULA:-}
      INITIAL_ADMIN_1_NAME: ${INITIAL_ADMIN_1_NAME:-}
      INITIAL_ADMIN_1_EMAIL: ${INITIAL_ADMIN_1_EMAIL:-}
      INITIAL_ADMIN_2_CEDULA: ${INITIAL_ADMIN_2_CEDULA:-}
      INITIAL_ADMIN_2_NAME: ${INITIAL_ADMIN_2_NAME:-}
      INITIAL_ADMIN_2_EMAIL: ${INITIAL_ADMIN_2_EMAIL:-}
    volumes:
      - file-storage:/var/lib/logicode/files
      - ./.local/mail-outbox:/var/lib/logicode/mail-outbox
      - backups:/var/lib/logicode/backups
    networks: [default, datos]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  # Modelo de IA local (RN-11, RN-18). Solo arranca con `--profile ia`; el modelo se descarga una vez con
  # `docker compose exec ollama ollama pull qwen2.5vl:7b` y queda en el volumen ollama-models.
  ollama:
    image: ollama/ollama:0.35.1
    profiles: ["ia"]
    restart: unless-stopped
    environment:
      # Un modelo cargado y una evaluación a la vez: en CPU no gana nada atender en paralelo.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama

  # Respaldos (RNF-09): copia diaria de la base y de los archivos, prueba de restauración y retención por días.
  # Restaurar: `docker compose stop backend minio` y `docker compose run --rm --no-deps backup restaurar <copia>` (respaldos/README.md).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    # Después del backend, para copiar la base ya migrada.
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["sh", "/opt/logicode/respaldo.sh"]
    command: ["servicio"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-logicode}
      PGUSER: ${DB_USERNAME:-logicode}
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./respaldos/respaldo.sh:/opt/logicode/respaldo.sh:ro
      - file-storage:/archivos
      - minio-data:/minio
      - backups:/respaldos
    networks: [datos]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

# Red por servicio (guía 10, T-98): la interfaz, la única expuesta a la red del aula, no llega a la base ni a MinIO;
# solo el backend y los respaldos están en la red datos.
networks:
  datos:

volumes:
  db-data:
  # Datos de MinIO: los archivos cargados (materiales y entregas). El servicio backup lo copia junto con la base.
  minio-data:
  # Cargas en curso y archivos de antes de MinIO, que el backend sube a MinIO al arrancar.
  file-storage:
  # Copias de la base y de los archivos. Para guardarlas fuera del equipo: respaldos/README.md.
  backups:
  # Modelos descargados por Ollama (unos 6 GB para Qwen2.5-VL 7B Q4_K_M).
  ollama-models:
