# Configuración de LogiCode. Todo valor sensible o dependiente del entorno se lee de variables de entorno.
# Ver .env.example en la raíz del repositorio.
spring:
  application:
    name: logicode
  autoconfigure:
    # Las cuentas viven en PostgreSQL (módulo identity); se evita el usuario en memoria
    # con contraseña generada que Spring Security crea por defecto.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logicode}
    username: ${DB_USERNAME:logicode}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    # Secretos de Docker (p. ej. brevo_api_key) montados como archivos en /run/secrets.
    import: optional:configtree:/run/secrets/
  session:
    timeout: ${SESSION_TIMEOUT:2h}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # Materiales: hasta 500 MB y videos hasta 1 GB (RNF-04). El límite por formato lo valida el módulo files;
      # los CSV de estudiantes se limitan a 1 MB en su controlador.
      max-file-size: 1GB
      max-request-size: 1100MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: ${LOGICODE_TIME_ZONE:America/Bogota}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Detrás de Nginx: reconoce el HTTPS del piloto por X-Forwarded-Proto (solo de redes internas), así la cookie CSRF sale con Secure.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: LOGICODE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

logicode:
  environment: ${LOGICODE_ENVIRONMENT:local}
  time-zone: ${LOGICODE_TIME_ZONE:America/Bogota}
  identity:
    public-url: ${LOGICODE_PUBLIC_URL:http://localhost:5173}
    initial-admins:
      - cedula: ${INITIAL_ADMIN_1_CEDULA:}
        full-name: ${INITIAL_ADMIN_1_NAME:}
        email: ${INITIAL_ADMIN_1_EMAIL:}
      - cedula: ${INITIAL_ADMIN_2_CEDULA:}
        full-name: ${INITIAL_ADMIN_2_NAME:}
        email: ${INITIAL_ADMIN_2_EMAIL:}
  files:
    # local: carpeta storage-dir. minio: MinIO (docker-compose.yml, P-05); la carpeta queda para las cargas en curso.
    storage: ${LOGICODE_FILES_STORAGE:local}
    storage-dir: ${LOGICODE_FILES_DIR:file-storage}
    minio:
      endpoint: ${LOGICODE_MINIO_URL:http://localhost:9000}
      bucket: ${LOGICODE_MINIO_BUCKET:logicode}
      access-key: ${MINIO_ROOT_USER:}
      secret-key: ${MINIO_ROOT_PASSWORD:}
      # MinIO no usa regiones, pero la firma S3 lleva una.
      region: us-east-1
    # RN-21 / RNF-12: mínimo 6 meses.
    retention-months: ${LOGICODE_FILE_RETENTION_MONTHS:6}
  backups:
    # Carpeta compartida con el servicio backup (volumen backups en Docker): respaldos, latido y solicitudes.
    dir: ${LOGICODE_BACKUPS_DIR:backups}
  mail:
    # outbox: guarda los correos como archivos (desarrollo). brevo: envía con Brevo (requiere secretos).
    provider: ${LOGICODE_MAIL_PROVIDER:outbox}
    outbox-dir: ${LOGICODE_MAIL_OUTBOX_DIR:mail-outbox}
    sender-name: ${BREVO_SENDER_NAME:LogiCode}
  ai:
    # Calificación con IA (Etapa 6): Ollama + Qwen2.5-VL 7B. Apagada, las entregas pasan a Por revisar.
    enabled: ${LOGICODE_AI_ENABLED:false}
    ollama-url: ${LOGICODE_AI_OLLAMA_URL:http://localhost:11434}
    model: ${LOGICODE_AI_MODEL:qwen2.5vl:7b}
    timeout: ${LOGICODE_AI_TIMEOUT:10m}
    keep-alive: ${LOGICODE_AI_KEEP_ALIVE:30m}
    context-tokens: ${LOGICODE_AI_CONTEXT_TOKENS:16384}
    max-image-side: ${LOGICODE_AI_MAX_IMAGE_SIDE:1280}
    max-attempts: ${LOGICODE_AI_MAX_ATTEMPTS:3}
    retry-delay: ${LOGICODE_AI_RETRY_DELAY:2m}
    poll-interval: ${LOGICODE_AI_POLL_INTERVAL:5s}
    # Calibración por curso (T-90): notas comparadas con el docente antes de dejar que la IA publique sola.
    calibration-min-comparisons: ${LOGICODE_AI_CALIBRATION_MIN:10}
    worker-enabled: true

management:
  endpoints:
    web:
      exposure:
        # metrics: memoria, solicitudes y conexiones; el puerto del backend solo escucha en 127.0.0.1 (Etapa 9).
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
