# Configuración de LogiCode. Todo valor sensible o dependiente del entorno se lee de variables de entorno.
# Ver .env.example en la raíz del repositorio.
spring:
  application:
    name: logicode
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logicode}
    username: ${DB_USERNAME:logicode}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: ${LOGICODE_TIME_ZONE:America/Bogota}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logicode:
  environment: ${LOGICODE_ENVIRONMENT:local}
  time-zone: ${LOGICODE_TIME_ZONE:America/Bogota}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
