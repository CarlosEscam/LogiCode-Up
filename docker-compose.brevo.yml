# LogiCode · envío real de correos con Brevo.
# Uso: docker compose -f docker-compose.yml -f docker-compose.brevo.yml up --build
#
# Antes, crea secrets/brevo_api_key.txt con la API key de Brevo (una sola línea; la carpeta secrets/ está fuera
# del repositorio). Spring Boot la lee desde /run/secrets/brevo_api_key.
# El remitente (P-06) es BREVO_SENDER_EMAIL en .env y debe estar verificado en Brevo.

services:
  backend:
    environment:
      LOGICODE_MAIL_PROVIDER: brevo
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-logicode.notificaciones@gmail.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-LogiCode}
    secrets:
      - brevo_api_key

secrets:
  brevo_api_key:
    file: ./secrets/brevo_api_key.txt
