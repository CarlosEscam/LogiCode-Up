# Prometheus del perfil observabilidad (guía 13, T-99). Lee las métricas del backend por la red interna de Compose.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: logicode-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
