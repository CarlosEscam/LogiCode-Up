# Sitio LogiCode, común a HTTP (desarrollo) y HTTPS (piloto). Lo incluye el bloque server de cada modo.
root /usr/share/nginx/html;
index index.html;
server_tokens off;
# Las redirecciones que genere Nginx son relativas: adentro escucha en 8080, afuera es 3000, 80 o 443 (T-98).
absolute_redirect off;

# Límite alineado con el máximo de archivos (1 GB para videos, RNF-04), con margen para el formulario.
client_max_body_size 1100m;

# Docker cambia la IP del backend cada vez que recrea su contenedor; sin esto Nginx guarda la primera y responde 502
# hasta reiniciarlo (II-04, D-3). 127.0.0.11 es el DNS interno de Docker.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8080;

# P-09 (pentest 2026-11-11): HSTS solo cuando llega por ngrok (HTTPS con certificado público). En el piloto con la
# autoridad local no se manda (R11-04): si el certificado vence, HSTS quitaría el "continuar de todos modos".
set $hsts "";
if ($http_x_forwarded_proto = "https") { set $hsts "max-age=31536000"; }

location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se reemplaza, no se agrega: así nadie se inventa otra IP con su propia cabecera para saltarse los límites.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Cargas y descargas grandes pasan directo, sin copiarse a disco en Nginx; el backend
    # entrega videos por partes (Range) para la vista previa.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location = /swagger-ui.html { proxy_pass $backend; }
location /swagger-ui/ { proxy_pass $backend; }

# Aplicación de una sola página: las rutas desconocidas cargan index.html.
# Cabeceras de seguridad de la interfaz (Etapa 9). La API trae las suyas desde Spring Security.
# CSP: solo recursos propios (los estilos que pone React van por CSSOM y no los bloquea).
location / {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Vacío (sin ngrok) no se envía.
    add_header Strict-Transport-Security $hsts always;
    try_files $uri $uri/ /index.html;
}
