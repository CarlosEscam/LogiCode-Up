server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite alineado con el máximo de archivos (1 GB para videos). Se ajustará cuando
    # se implemente la carga de archivos en la Etapa 4/5.
    client_max_body_size 1g;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /swagger-ui.html { proxy_pass http://backend:8080; }
    location /swagger-ui/ { proxy_pass http://backend:8080; }

    # Aplicación de una sola página: las rutas desconocidas cargan index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
