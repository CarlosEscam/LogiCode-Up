# CI de LogiCode (guía 9, T-102). Cada job llama a ci/ci-local.mjs, el mismo script que se corre en el PC del
# proyecto con `node ci/ci-local.mjs`; así la CI de GitHub y la local hacen exactamente lo mismo, con las mismas
# imágenes de Docker. Por decisión de Carlos (6 de noviembre de 2026) el repositorio no se sube a GitHub: este archivo
# queda listo por si algún día se sube, y hoy se ejecuta la versión local (ci/README.md).
#
# Puertas que bloquean (el job termina en rojo):
#   lint      oxlint sin advertencias y los tres docker-compose válidos
#   backend   pruebas unitarias, ArchUnit e integración con PostgreSQL; cobertura >= 85 % de líneas y 68 % de ramas
#   frontend  pruebas de Vitest y construcción de Vite
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node ci/ci-local.mjs lint

  backend:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node ci/ci-local.mjs backend
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node ci/ci-local.mjs frontend
